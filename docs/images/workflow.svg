<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">A shared plan. Parallel work. Independent review.</title>
<desc id="desc">Main conveys user needs and keeps the workflow moving. One Designer designs; many Workers execute in parallel; after other writers finish, one Reviewer reviews, repairs and integrates.</desc>
<rect width="1200" height="430" rx="16" fill="#f4f2ec"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#222a26">
<text x="48" y="56" font-size="14" font-weight="700" letter-spacing="2" fill="#335c43">A SHARED PLAN. A COMPLETE RESULT.</text>
<rect x="48" y="82" width="1104" height="55" rx="6" fill="#e4eadf"/>
<text x="72" y="116" font-size="19"><tspan font-weight="700">Main</tspan><tspan dx="20">Convey user needs · Relay questions · Keep work moving</tspan></text>
<g stroke="#ccd2c7" fill="none"><rect x="48" y="174" width="300" height="169" rx="6"/><rect x="450" y="174" width="300" height="169" rx="6"/><rect x="852" y="174" width="300" height="169" rx="6"/></g>
<g fill="#335c43" font-size="36" font-weight="700"><text x="72" y="225">1 Designer</text><text x="474" y="225">N Workers</text><text x="876" y="225">1 Reviewer</text></g>
<g font-size="20"><text x="72" y="274">Design what the goal needs.</text><text x="474" y="274">Execute in parallel.</text><text x="876" y="274">Review. Repair. Integrate.</text></g>
<g font-size="15" fill="#636d65"><text x="72" y="310">One coherent design</text><text x="474" y="310">Autonomous contributions</text><text x="876" y="310">Other writers have finished</text></g>
<g stroke="#335c43" stroke-width="3" fill="none"><path d="M370 259h55m-10-9 10 9-10 9"/><path d="M772 259h55m-10-9 10 9-10 9"/></g>
<text x="48" y="393" font-size="17" fill="#636d65">Every agent reads the shared requirements, plan, repository, and evidence directly.</text>
</g></svg>
