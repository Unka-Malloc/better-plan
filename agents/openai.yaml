interface:
  display_name: "Better Plan"
  short_description: "One-graph delivery with a designer, worker slots, and a reviewer"
  default_prompt: "Use the native workflow when maintaining the Better Plan source repository. Elsewhere, use $better-plan for large, high-risk, migration, or multi-part delivery: author one Checkpoints Tree with a single designer Node, worker Nodes that name their executors in fallback order, and a single reviewer Node; run every ready Node, let tree-verify produce the evidence for Nodes that declare commands, report failures with the executor that failed so the chain moves on, and close through the reviewer."
